# Builds the Windows installer and attaches it to a GitHub Release.
#
# Trigger: push a version tag, e.g.
#   git tag v1.0.0
#   git push origin v1.0.0
# The installer is then downloadable at
#   https://github.com/zepph7/subtitle-generator/releases/latest/download/Subtitle-Generator-Setup.exe

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npx electron-builder --win --publish never

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Subtitle-Generator-Setup
          path: dist/Subtitle-Generator-Setup.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Subtitle-Generator-Setup.exe
          generate_release_notes: true
