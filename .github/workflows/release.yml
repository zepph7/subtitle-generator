# Builds the app for Windows, Linux and macOS and attaches the files to a GitHub Release.
#
# Trigger: push a version tag, e.g.
#   git tag v1.0.3
#   git push origin main --tags
# Download links (always the newest release):
#   https://github.com/zepph7/subtitle-generator/releases/latest/download/Subtitle-Generator-Setup.exe
#   https://github.com/zepph7/subtitle-generator/releases/latest/download/Subtitle-Generator-x86_64.AppImage
#   https://github.com/zepph7/subtitle-generator/releases/latest/download/Subtitle-Generator-amd64.deb
#   https://github.com/zepph7/subtitle-generator/releases/latest/download/Subtitle-Generator-mac-arm64.dmg
#   https://github.com/zepph7/subtitle-generator/releases/latest/download/Subtitle-Generator-mac-x64.dmg

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
            files: dist/Subtitle-Generator-Setup.exe
          - os: ubuntu-latest
            args: --linux
            files: |
              dist/Subtitle-Generator-*.AppImage
              dist/Subtitle-Generator-*.deb
          - os: macos-latest
            args: --mac --x64 --arm64
            files: dist/Subtitle-Generator-mac-*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx electron-builder ${{ matrix.args }} --publish never

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: ${{ matrix.files }}

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.files }}
          generate_release_notes: true
